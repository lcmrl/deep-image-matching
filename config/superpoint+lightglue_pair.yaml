# Configuration for SuperPoint + LightGlue Pair Matching (with rotation invariance)
# This matcher handles non-rotation-invariant matching by trying 4 rotations (0, 90, 180, 270)
# and selecting matches from the pair with the most matches.

general:
  tile_size: (2400, 2000)
  geom_verification: MAGSAC # NONE, PYDEGENSAC, MAGSAC, RANSAC, LMEDS, RHO, USAC_DEFAULT, USAC_PARALLEL, USAC_FM_8PTS, USAC_FAST, USAC_ACCURATE, USAC_PROSAC, USAC_MAGSAC
  min_inliers_per_pair: 10
  min_inlier_ratio_per_pair: 0.15
  gv_threshold: 1

extractor:
  name: "no_extractor"

matcher:
  name: "superpoint_lightglue_pair"
  # SuperPoint extractor configuration
  sp_cfg:
    nms_radius: 5
    max_keypoints: 4000
    keypoint_threshold: 0.005
  # LightGlue matcher configuration
  lg_cfg:
    features: "superpoint"
    n_layers: 9
    depth_confidence: 0.9
    width_confidence: 0.95
    filter_threshold: 0.3
    flash: True
